<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail - Sanjay Tarakanambi - Outlook (Training Simulation)</title>
<style>
  :root {
    --brand: #0f6cbd;
    --brand-hover: #115ea3;
    --brand-pressed: #0c3b5e;
    --brand-tint: #ebf3fc;
    --brand-tint2: #cfe4fa;
    --text: #242424;
    --text2: #424242;
    --text3: #616161;
    --text4: #707070;
    --border: #e0e0e0;
    --border2: #ebebeb;
    --hover: #f5f5f5;
    --pressed: #e0e0e0;
    --bg2: #fafafa;
    --bg3: #f0f0f0;
    --canvas: #f0f0f0;
    --green: #107c10;
    --green-bg: #dff6dd;
    --red: #c50f1f;
    --red-bg: #fde7e9;
    --amber: #835b00;
    --amber-bg: #fff4ce;
    --amber-border: #f2c661;
    --font: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  svg { display: block; }

  /* ---------- Training controls (in ribbon tab row) ---------- */
  .ribbon-tools {
    margin-left: auto; align-self: center;
    display: flex; align-items: center; gap: 8px; padding-right: 12px;
  }
  .score-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 26px;
    background: #fff;
    border: 1px solid #d1d1d1;
    border-radius: 5px;
    padding: 0 10px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .score-chip .score-num { color: var(--brand); font-size: 14px; }
  .score-chip .score-sub { color: var(--text3); font-weight: 400; font-size: 12px; }
  .reset-btn {
    height: 26px;
    background: #fff;
    border: 1px solid #d1d1d1;
    border-radius: 5px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .reset-btn:hover { background: var(--hover); }
  .reset-btn:active { background: var(--pressed); }

  /* ---------- OWA frame ---------- */
  .owa { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--canvas); }

  /* Top bar */
  .topbar {
    height: 48px;
    background: var(--brand);
    color: #fff;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    position: relative;
  }
  .topbar-left { display: flex; align-items: center; height: 100%; }
  .waffle {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff; background: transparent; border: 0;
  }
  .waffle:hover { background: rgba(255,255,255,0.12); }
  .app-title { font-size: 16px; font-weight: 600; padding: 0 8px 0 4px; letter-spacing: 0.01em; }
  .search-wrap { margin-left: 150px; width: 356px; max-width: 30vw; }
  .search-box {
    height: 30px;
    background: #fff;
    border-radius: 6px;
    display: flex; align-items: center;
    padding: 0 8px 0 12px;
    color: var(--text2);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .search-box input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font-family: inherit; font-size: 14px; color: var(--text); margin-left: 8px;
  }
  .search-box input::placeholder { color: var(--text2); }
  .search-box .search-filter { display: none; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; height: 100%; padding-right: 6px; }
  .top-icon {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; background: transparent; border: 0; cursor: pointer; position: relative;
  }
  .top-icon:hover { background: rgba(255,255,255,0.12); }
  .top-icon .badge {
    position: absolute; top: 9px; right: 7px;
    background: #d13438; color: #fff; font-size: 10px; font-weight: 600;
    border-radius: 8px; min-width: 16px; height: 16px; line-height: 16px; text-align: center; padding: 0 4px;
  }
  .me-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #e8eef7; color: #3b4a63;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; margin: 0 8px 0 8px;
    border: 2px solid rgba(255,255,255,0.85);
    cursor: pointer;
  }
  .me-wrap { position: relative; height: 100%; display: flex; align-items: center; }
  .me-card {
    position: absolute; top: 44px; right: 8px; z-index: 40;
    display: flex; align-items: center; gap: 12px;
    background: #fff; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.16);
    padding: 12px 16px; white-space: nowrap;
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity .12s, transform .12s, visibility .12s;
  }
  .me-wrap:hover .me-card, .me-wrap:focus-within .me-card { opacity: 1; visibility: visible; transform: translateY(0); }
  .me-card-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #4f6bed; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px;
  }
  .me-card-name { font-size: 14px; font-weight: 600; }
  .me-card-mail { font-size: 12px; color: var(--text3); margin-top: 2px; }

  /* Ribbon (simplified, new Outlook) */
  .ribbon { flex-shrink: 0; background: var(--canvas); padding: 0 0 8px 0; }
  .ribbon-tabs { display: flex; align-items: center; height: 36px; padding: 0 12px 0 6px; gap: 0; }
  .hamburger {
    width: 32px; height: 30px; display: flex; align-items: center; justify-content: center;
    border: 0; background: transparent; color: var(--text); border-radius: 4px; cursor: pointer; margin-right: 10px;
  }
  .hamburger:hover { background: rgba(0,0,0,.05); }
  .ribbon-tab {
    padding: 5px 8px; font-size: 14px; color: var(--text); cursor: pointer; position: relative;
    border: 0; background: transparent; border-radius: 4px; margin-right: 4px;
  }
  .ribbon-tab:hover { background: rgba(0,0,0,.05); }
  .ribbon-tab.active { font-weight: 600; }
  .ribbon-tab.active::after {
    content: ""; position: absolute; left: 8px; right: 8px; bottom: -2px; height: 3px;
    background: var(--brand); border-radius: 3px;
  }
  .cmd-row { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 3px; }
  .cmdbar {
    flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; padding: 0 8px; gap: 1px;
    background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.04);
    overflow: hidden;
  }
  .newmail {
    display: inline-flex; align-items: center; height: 30px;
    background: var(--brand); color: #fff; border: 0; border-radius: 5px;
    font-weight: 600; font-size: 14px; cursor: pointer; margin-right: 8px; overflow: hidden; flex-shrink: 0;
  }
  .newmail .nm-main { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 10px; height: 100%; }
  .newmail .nm-main:hover { background: var(--brand-hover); }
  .newmail .nm-chev { display: flex; align-items: center; padding: 0 8px; height: 100%; border-left: 1px solid rgba(255,255,255,0.35); }
  .newmail .nm-chev:hover { background: var(--brand-hover); }
  .cmd {
    display: inline-flex; align-items: center; gap: 4px;
    height: 30px; padding: 0 5px; border-radius: 4px; flex-shrink: 0;
    background: transparent; border: 0; color: var(--text); font-size: 14px; cursor: pointer;
  }
  .cmd:hover { background: var(--hover); }
  .cmd:active { background: var(--pressed); }
  .cmd svg { color: var(--brand); }
  .cmd.muted svg { color: #8a8a8a; }
  .cmd .chev { color: #a0a0a0; margin-left: -2px; }
  .cmd.outlined { border: 1px solid #c8c8c8; padding: 0 9px; height: 30px; border-radius: 5px 0 0 5px; }
  .cmd.outlined + .cmd.outlined-chev { border: 1px solid #c8c8c8; border-left: 0; border-radius: 0 5px 5px 0; padding: 0 7px; margin-left: 0; height: 30px; }
  .cmd-sep { width: 1px; height: 22px; background: var(--border); margin: 0 5px; flex-shrink: 0; }
  .cmd-spacer { flex: 1; min-width: 20px; }
  .copilot-pill {
    width: 44px; height: 40px; border-radius: 8px; background: #fff; flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.04);
    display: flex; align-items: center; justify-content: center; cursor: pointer; border: 0;
  }
  .copilot-pill:hover { background: var(--hover); }
  .copilot-logo, .teams-logo { display: block; object-fit: contain; pointer-events: none; }
  .app-btn .copilot-logo { width: 24px; height: 24px; }

  /* Main area */
  .main { flex: 1; display: flex; min-height: 0; padding: 0 11px 10px 0; gap: 12px; }

  /* App bar */
  .shell { flex: 1; display: flex; min-height: 0; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .appbar {
    width: 50px; background: transparent;
    display: flex; flex-direction: column; align-items: center; padding-top: 2px; gap: 8px; flex-shrink: 0;
  }
  .app-btn {
    width: 36px; height: 38px; border-radius: 6px; border: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
  }
  .app-btn svg { width: 22px; height: 22px;
  }
  .app-btn:hover { background: rgba(0,0,0,.05); }
  .app-btn.active::before {
    content: ""; position: absolute; left: -4px; top: 9px; bottom: 9px; width: 3px;
    background: var(--brand); border-radius: 0 3px 3px 0;
  }

  /* Folder pane */
  .folders {
    width: 212px; display: flex; flex-direction: column;
    flex-shrink: 0; overflow-y: auto; padding: 4px 6px 6px 4px; background: transparent;
  }
  .folder-section { padding: 4px 0 6px; }
  .folder-header {
    display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px 0 14px;
    font-weight: 600; font-size: 15px; color: var(--text); cursor: pointer; border-radius: 4px;
  }
  .folder-header:hover { background: rgba(0,0,0,.05); }
  .folder-header .chev { color: var(--text2); }
  .folder-header .acct { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder {
    display: flex; align-items: center; height: 36px; padding: 0 10px 0 40px; margin: 0;
    border-radius: 4px; cursor: pointer; color: var(--text); position: relative; font-size: 14px;
  }
  .folder:hover { background: rgba(0,0,0,.05); }
  .folder.selected { background: #e6e6e6; font-weight: 600; }
  .folder svg { color: var(--text2); margin-right: 10px; flex-shrink: 0; width: 18px; height: 18px; }
  .folder .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder .fcount { color: var(--brand); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .folder .fcount.grey { color: var(--text3); font-weight: 400; }
  .folder.groups { margin-top: 10px; }

  /* Message list (card) */
  .list {
    width: 360px; display: flex; flex-direction: column; flex-shrink: 0;
    background: #fff; border-radius: 8px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  }
  .list-head {
    height: 44px; display: flex; align-items: center; padding: 0 8px 0 0;
    border-bottom: 1px solid var(--border2);
  }
  .list-tabs { display: flex; gap: 2px; height: 100%; align-items: center; padding-left: 66px; }
  .list-tab {
    padding: 5px 7px; font-size: 15px; color: var(--text2); cursor: pointer; position: relative;
    background: transparent; border: 0; font-weight: 400; border-radius: 4px;
  }
  .list-tab:hover { background: var(--hover); }
  .list-tab.active { color: var(--text); font-weight: 600; }
  .list-tab.active::after {
    content: ""; position: absolute; left: 7px; right: 7px; bottom: -3px; height: 3px;
    background: var(--brand); border-radius: 3px;
  }
  .list-icons { display: flex; align-items: center; gap: 0; margin-left: 6px; }
  .list-ic {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: var(--text); border-radius: 4px; cursor: pointer;
  }
  .list-ic svg { width: 18px; height: 18px;
  }
  .list-ic:hover { background: var(--hover); }
  .list-filter { display: none; }
  .list-items { flex: 1; overflow-y: auto; }
  .group-hdr {
    display: flex; align-items: center; gap: 14px;
    font-size: 14px; font-weight: 600; color: var(--text);
    height: 38px; padding: 0 16px 0 66px; background: #fafafa; border-bottom: 1px solid var(--border2);
    position: relative;
  }
  .group-hdr::before {
    content: ""; position: absolute; left: 42px; top: 13px; width: 7px; height: 7px;
    border-right: 1.6px solid var(--text2); border-bottom: 1.6px solid var(--text2); transform: rotate(45deg);
  }
  .msg {
    position: relative; display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 22px 10px 30px; border-bottom: 1px solid var(--border2);
    cursor: pointer; background: #fff; min-height: 80px;
  }
  .msg:hover { background: var(--hover); }
  .msg.selected { background: #e9f2fc; }
  .msg.selected:hover { background: #ddebf9; }
  .msg.unread::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--brand);
  }
  .msg .av {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; margin-top: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 12px;
  }
  .msg .check {
    width: 18px; height: 18px; border: 1px solid #616161; border-radius: 3px; flex-shrink: 0;
    margin: 17px 7px 0 7px; background: #fff; display: none;
  }
  .msg.selected .av { display: none; }
  .msg.selected .check { display: block; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .row1 { display: flex; align-items: baseline; }
  .msg .sender {
    flex: 1; min-width: 0; font-size: 14px; color: var(--text); font-weight: 400; line-height: 20px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .msg.unread .sender { font-weight: 600; }
  .msg .row2 { display: flex; align-items: baseline; }
  .msg .subject {
    flex: 1; min-width: 0; font-size: 14px; color: var(--text); line-height: 20px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .msg.unread .subject { color: var(--brand); font-weight: 600; }
  .msg .time { font-size: 13px; color: var(--text3); margin-left: 8px; white-space: nowrap; line-height: 20px; }
  .msg.unread .time { color: var(--brand); font-weight: 600; }
  .msg .preview {
    font-size: 14px; color: var(--text3); line-height: 20px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .msg .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .msg .meta svg { color: var(--text3); }
  .msg .verdict {
    font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px;
  }
  .verdict.ok { background: var(--green-bg); color: var(--green); }
  .verdict.bad { background: var(--red-bg); color: var(--red); }

  /* Reading pane */
  .reading { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; overflow: hidden; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
  .reading-scroll { flex: 1; overflow-y: auto; }
  .empty-state {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text3); gap: 6px; padding: 40px;
  }
  .empty-state svg { margin-bottom: 30px; }
  .empty-state .es-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .empty-state .es-sub { font-size: 14px; color: var(--text3); }
  .rp-subject {
    font-size: 20px; font-weight: 600; line-height: 28px;
    padding: 18px 24px 8px; color: var(--text); word-break: break-word;
  }
  .rp-header { display: flex; align-items: flex-start; padding: 8px 24px 12px; gap: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 15px;
  }
  .rp-from { flex: 1; min-width: 0; }
  .rp-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .rp-addr { color: var(--text3); font-weight: 400; margin-left: 4px; word-break: break-all; }
  .rp-to { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .rp-to .hint { color: var(--brand); cursor: default; }
  .rp-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .rp-date { font-size: 12px; color: var(--text3); white-space: nowrap; }
  .rp-actions { display: flex; gap: 2px; }
  .rp-act {
    width: 32px; height: 32px; border: 0; background: transparent; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; color: var(--text2); cursor: pointer;
  }
  .rp-act:hover { background: var(--hover); }
  .rp-attachments { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 12px; }
  .attach {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px 6px 8px;
    background: #fff; cursor: pointer; font-size: 13px; max-width: 100%;
  }
  .attach:hover { background: var(--hover); }
  .attach .aicon {
    width: 28px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .attach .aname { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attach .asize { color: var(--text3); font-size: 12px; }
  .rp-body {
    padding: 8px 24px 24px; font-size: 14px; line-height: 20px; color: var(--text);
    border-top: 1px solid var(--border2); margin-top: 4px; padding-top: 18px;
  }
  .rp-body p { margin: 0 0 14px; }
  .rp-body .sig { color: var(--text2); }
  .rp-body .lnk { color: #0f6cbd; text-decoration: underline; cursor: pointer; word-break: break-all; }
  .rp-body .lnk:hover { color: var(--brand-pressed); }
  .rp-body .promo-hero {
    background: linear-gradient(135deg, #ff5f6d, #ffc371); color: #fff; text-align: center;
    padding: 28px 16px; border-radius: 6px; margin-bottom: 14px;
  }
  .rp-body .promo-hero h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: .02em; }
  .rp-body .promo-hero p { margin: 0; font-size: 15px; }
  .rp-body .cta {
    display: inline-block; padding: 10px 22px; border-radius: 4px; color: #fff; font-weight: 700;
    text-decoration: none; cursor: pointer; margin: 4px 0 14px;
  }
  .rp-body .fine { font-size: 11px; color: var(--text4); line-height: 15px; }
  .rp-body .crypto-hero { background: #0b1e3a; color: #f4d35e; text-align: center; padding: 24px; border-radius: 6px; margin-bottom: 14px; }
  .rp-body .crypto-hero h2 { margin: 0 0 4px; font-size: 24px; }
  .rp-body .crypto-hero p { margin: 0; color: #cfe0ff; }
  .rp-body .aws-box { border: 1px solid var(--border); border-radius: 4px; padding: 12px 16px; margin: 0 0 14px; background: var(--bg2); }
  .rp-body .aws-box .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .rp-body .aws-box .row .k { color: var(--text3); }
  .rp-body .brand-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .rp-body .brand-logo {
    width: 34px; height: 34px; border-radius: 4px; color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
  }
  .rp-body .caution-bar {
    background: var(--amber-bg); border: 1px solid var(--amber-border); color: #323130;
    padding: 6px 10px; border-radius: 4px; font-size: 12px; margin-bottom: 14px;
  }

  /* Training card */
  .train {
    margin: 0 24px 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2);
    padding: 14px 16px;
  }
  .train-title { font-size: 13px; font-weight: 600; color: var(--text2); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .train-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .train-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .tbtn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid #d1d1d1; background: #fff; color: var(--text);
  }
  .tbtn:hover { background: var(--hover); }
  .tbtn:disabled { cursor: default; opacity: .55; }
  .tbtn.phish { border-color: #e37d80; color: var(--red); }
  .tbtn.phish:hover:not(:disabled) { background: var(--red-bg); }
  .tbtn.spam { border-color: #d9a540; color: var(--amber); }
  .tbtn.spam:hover:not(:disabled) { background: var(--amber-bg); }
  .tbtn.safe { border-color: #6bb700; color: var(--green); }
  .tbtn.safe:hover:not(:disabled) { background: var(--green-bg); }
  .tbtn.chosen { outline: 2px solid var(--brand); outline-offset: 1px; opacity: 1; }
  .result { margin-top: 12px; border-radius: 4px; padding: 12px 14px; font-size: 13px; line-height: 19px; }
  .result.ok { background: var(--green-bg); border: 1px solid #9fd89f; }
  .result.bad { background: var(--red-bg); border: 1px solid #f1a7ad; }
  .result .r-head { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .result.ok .r-head { color: var(--green); }
  .result.bad .r-head { color: var(--red); }
  .result .r-type { font-weight: 600; margin-bottom: 6px; }
  .result ul { margin: 6px 0 0; padding-left: 20px; }
  .result li { margin: 2px 0; }
  .result .tip { margin-top: 8px; font-style: italic; color: var(--text2); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #292929; color: #fff; padding: 10px 16px; border-radius: 4px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 50;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Completion */
  .done-summary {
    margin: 0 24px 24px; padding: 14px 16px; border-radius: 6px;
    background: var(--brand-tint); border: 1px solid #b4d6fa; font-size: 14px;
  }
  .done-summary strong { color: var(--brand); }

  @media (max-width: 1200px) {
    .folders { display: none; }
    .list { width: 360px; }
    .search-wrap { max-width: 32vw; margin-left: 60px; }
  }
</style>
</head>

    {

      time: 'Tue 9:05 AM',
      fullDate: 'Tue 10/7/2025 9:05 AM',
      color: '#da3b01',
      type: 'safe',
      body: `

      flags: [

        'Does not ask for credentials or payment in the email — it simply directs you to the official console URL (<b>console.aws.amazon.com</b>).',

  ];

  const LABELS = { phishing: 'Phishing', spam: 'Spam', safe: 'Safe' };
  const STORAGE_KEY = null; // Intentionally no persistence: nothing is stored anywhere.

  let state = { selectedId: null, read: {}, answers: {} };

  const listEl = document.getElementById('listItems');
  const paneEl = document.getElementById('readingPane');
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function initials(name) {
    const parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  /* ---------------- Score ---------------- */
  function updateScore() {
    const ids = Object.keys(state.answers);
    const correct = ids.filter(id => state.answers[id] === EMAILS.find(e => e.id === id).type).length;
    document.getElementById('scoreCorrect').textContent = correct;
    document.getElementById('scoreAnswered').textContent = ids.length;
    const unread = EMAILS.filter(e => !state.read[e.id]).length;
    const c1 = document.getElementById('inboxCount');
    const c2 = document.getElementById('favInboxCount');
    c1.textContent = unread || '';
    c2.textContent = unread || '';
  }

  /* ---------------- Message list ---------------- */
  function renderList() {
    let html = '';
    let lastGroup = null;
    for (const e of EMAILS) {
      if (e.group !== lastGroup) {
        html += `<div class="group-hdr">${esc(e.group)}</div>`;
        lastGroup = e.group;
      }
      const cls = ['msg', state.read[e.id] ? '' : 'unread', state.selectedId === e.id ? 'selected' : ''].join(' ');
      const ans = state.answers[e.id];
      let verdict = '';
      if (ans) {
        const ok = ans === e.type;
        verdict = `<span class="verdict ${ok ? 'ok' : 'bad'}">${ok ? '✓ Correct' : '✗ Incorrect'}</span>`;
      }
      const clip = e.attachments ? `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m13.5 7.5-5.3 5.3a1.6 1.6 0 0 1-2.3-2.3l6-6a3 3 0 0 1 4.2 4.2l-6.5 6.5a4.4 4.4 0 0 1-6.2-6.2L9 3.4"/></svg>` : '';
      html += `
        <div class="${cls}" role="listitem" tabindex="0" data-id="${e.id}" aria-label="${esc(e.fromName)}, ${esc(e.subject)}">
          <span class="check" aria-hidden="true"></span>
          <div class="av" style="background:${e.color}" aria-hidden="true">${esc(initials(e.fromName))}</div>
          <div class="body">
            <div class="row1"><span class="sender">${esc(e.fromName)}</span></div>
            <div class="row2"><span class="subject">${esc(e.subject)}</span><span class="time">${esc(e.time)}</span></div>
            <div class="preview">${esc(e.preview)}</div>
            ${(clip || verdict) ? `<div class="meta">${clip}${verdict}</div>` : ''}
          </div>
        </div>`;
    }
    listEl.innerHTML = html;
  }

  /* ---------------- Reading pane ---------------- */
  function renderPane() {
    const e = EMAILS.find(x => x.id === state.selectedId);
    if (!e) {
      const answered = Object.keys(state.answers).length;

        <div class="empty-state">

    }

    const attachments = e.attachments ? `

        ${e.attachments.map(a => `
          <div class="attach" data-attach="${esc(a.name)}" title="Attachment (disabled in simulation)">

          </div>`).join('')}
      </div>` : '';

    let result = '';
    if (ans) {
      const ok = ans === e.type;
      const heading = e.type === 'safe' ? 'Why this is safe' : 'Red flags';
      result = `
        <div class="result ${ok ? 'ok' : 'bad'}" role="alert">
          <div class="r-head">${ok ? '✓ Correct!' : '✗ Not quite.'}</div>
          <div class="r-type">You marked it <b>${LABELS[ans]}</b>. This email is <b>${LABELS[e.type]}</b>.</div>
          <div><b>${heading}:</b></div>
          <ul>${e.flags.map(f => `<li>${f}</li>`).join('')}</ul>
          <div class="tip">Tip: ${e.tip}</div>
        </div>`;
    }

    const allDone = Object.keys(state.answers).length === EMAILS.length;
    const correct = Object.keys(state.answers).filter(id => state.answers[id] === EMAILS.find(x => x.id === id).type).length;
    const summary = allDone ? `
      <div class="done-summary">
        <strong>Exercise complete — you scored ${correct} / 8.</strong>
        ${correct === 8 ? ' Perfect! You spotted every trick.' : ' Review the messages marked ✗ in the list to see what you missed, then press <b>Reset exercise</b> to try again.'}
      </div>` : '';

    paneEl.innerHTML = `
      <div class="rp-subject">${esc(e.subject)}</div>
      <div class="rp-header">
        <div class="avatar" style="background:${e.color}">${esc(initials(e.fromName))}</div>
        <div class="rp-from">
          <div class="rp-name">${esc(e.fromName)} <span class="rp-addr">&lt;${esc(e.fromAddr)}&gt;</span></div>
          <div class="rp-to">To: <span class="hint" title="sanjay.tarakanambi@graco.com">Sanjay Tarakanambi</span></div>
        </div>
        <div class="rp-right">
          <div class="rp-date">${esc(e.fullDate)}</div>
          <div class="rp-actions">
            <button class="rp-act" type="button" data-disabled title="Reply"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-5 4.5L8 14"/><path d="M3.5 9.5H12a5 5 0 0 1 5 5v1"/></svg></button>
            <button class="rp-act" type="button" data-disabled title="Reply all"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m7 5-5 4.5L7 14M11 5 6 9.5l5 4.5"/><path d="M6.5 9.5H12a5 5 0 0 1 5 5v1"/></svg></button>
            <button class="rp-act" type="button" data-disabled title="Forward"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5 5 4.5-5 4.5"/><path d="M16.5 9.5H8a5 5 0 0 0-5 5v1"/></svg></button>
            <button class="rp-act" type="button" data-disabled title="More actions"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><circle cx="5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15" cy="10" r="1.6"/></svg></button>
          </div>
        </div>
      </div>
      ${attachments}
      <div class="rp-body">${e.body}</div>
      <div class="train">
        <div class="train-title"><span class="dot"></span>Training: How would you classify this message?</div>
        <div class="train-btns">
          <button class="tbtn phish ${ans === 'phishing' ? 'chosen' : ''}" type="button" data-answer="phishing" ${ans ? 'disabled' : ''}>

          </button>
          <button class="tbtn spam ${ans === 'spam' ? 'chosen' : ''}" type="button" data-answer="spam" ${ans ? 'disabled' : ''}>

            Mark as Spam
          </button>
          <button class="tbtn safe ${ans === 'safe' ? 'chosen' : ''}" type="button" data-answer="safe" ${ans ? 'disabled' : ''}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="m6.5 10 2.5 2.5 4.5-5"/></svg>
            Mark as Safe
          </button>
        </div>
        ${result}
      </div>
      ${summary}`;
    paneEl.scrollTop = 0;
  }

  /* ---------------- Actions ---------------- */
  function selectEmail(id) {
    state.selectedId = id;
    state.read[id] = true;
    renderList();
    renderPane();
    updateScore();
  }
  function answer(id, choice) {
    if (state.answers[id]) return;
    state.answers[id] = choice;
    renderList();
    renderPane();
    updateScore();
    const e = EMAILS.find(x => x.id === id);
    const ok = choice === e.type;
    if (Object.keys(state.answers).length === EMAILS.length) {
      const correct = Object.keys(state.answers).filter(k => state.answers[k] === EMAILS.find(x => x.id === k).type).length;
      toast(`Exercise complete — ${correct} of 8 correct.`);
    } else {
      toast(ok ? 'Correct!' : `Not quite — this one is ${LABELS[e.type]}.`);
    }
  }
  function reset() {
    state = { selectedId: null, read: {}, answers: {} };
    renderList();
    renderPane();
    updateScore();
    toast('Exercise reset. All messages are unread again.');
  }

  /* ---------------- Events (single delegated handler) ---------------- */
  document.addEventListener('click', ev => {
    const t = ev.target;

    const msg = t.closest('.msg');
    if (msg) { selectEmail(msg.dataset.id); return; }

    const ab = t.closest('[data-answer]');
    if (ab && !ab.disabled) { answer(state.selectedId, ab.dataset.answer); return; }

    if (t.closest('#resetBtn')) { reset(); return; }

    const lnk = t.closest('.lnk');
    if (lnk) {
      ev.preventDefault();
      toast(`Simulation: link disabled. It claims to go to ${lnk.dataset.url || 'an external site'}`);
      return;
    }
    const att = t.closest('.attach');
    if (att) {
      toast(`Simulation: attachments cannot be opened. (${att.dataset.attach})`);
      return;
    }
    if (t.closest('[data-disabled]')) {
      toast('This control is decorative in the training simulation.');
    }
  });

  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      const msg = ev.target.closest && ev.target.closest('.msg');
      if (msg) { ev.preventDefault(); selectEmail(msg.dataset.id); }
    }
    if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') {
      ev.preventDefault();
      ev.target.value = '';
      toast('Search is disabled in this training simulation.');
    }
  });

  // Show the real URL on hover for links (teaches "hover before you click").
  document.addEventListener('mouseover', ev => {
    const lnk = ev.target.closest && ev.target.closest('.lnk');
    if (lnk && lnk.dataset.url && !lnk.title) lnk.title = lnk.dataset.url;
  });

  renderList();
  renderPane();
  updateScore();
})();
</script>
